<title>Standings and Playoffs</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap">
<style>
:root {
  --bg: #edf0f3; --surface: #ffffff; --surface-2: #f5f7f9; --ink: #14202a; --muted: #566676; --line: #d3dae1;
  --accent: #0a6a73; --accent-ink: #ffffff; --accent-soft: #d6edef; --bad: #b3261e; --bad-soft: #f8dedb; --good: #1d7a43; --good-soft: #dcf0e3; --warn: #a85f00; --warn-soft: #f9e8cf;
  --gold: #a8780a; --gold-soft: #f6ebc8;
  --font-display: "Space Grotesk", "Inter", system-ui, sans-serif;
  --font-body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1920; --surface: #15232d; --surface-2: #1a2b37; --ink: #e5ecf1; --muted: #97a9b7; --line: #2a3d4a;
    --accent: #5ccdd6; --accent-ink: #052529; --accent-soft: #143439; --bad: #ff8a80; --bad-soft: #3b1f1d; --good: #7bd89c; --good-soft: #183425; --warn: #f2b45e; --warn-soft: #3a2c14;
    --gold: #e6bc5a; --gold-soft: #3b3015;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1920; --surface: #15232d; --surface-2: #1a2b37; --ink: #e5ecf1; --muted: #97a9b7; --line: #2a3d4a;
  --accent: #5ccdd6; --accent-ink: #052529; --accent-soft: #143439; --bad: #ff8a80; --bad-soft: #3b1f1d; --good: #7bd89c; --good-soft: #183425; --warn: #f2b45e; --warn-soft: #3a2c14;
  --gold: #e6bc5a; --gold-soft: #3b3015;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 14px; line-height: 1.45;
  padding-inline: max(16px, env(safe-area-inset-left, 0px)) max(16px, env(safe-area-inset-right, 0px)); padding-block: 20px 40px; }
h1, h2, h3 { font-family: var(--font-display); margin: 0; text-wrap: balance; }
button, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.wrap { max-width: 1100px; margin: 0 auto; display: grid; gap: 16px; }
.eyebrow { font-size: 11.5px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.top { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 8px 24px; }
.top h1 { font-size: 28px; letter-spacing: -0.01em; }
.badge { display: inline-block; padding: 2px 8px; border: 1px solid var(--line); border-radius: 999px; font-size: 11.5px; color: var(--muted); background: var(--surface); }
.bar { display: flex; flex-wrap: wrap; gap: 12px 16px; align-items: end; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 16px; }
.field { display: grid; gap: 2px; font-size: 12px; color: var(--muted); min-width: 0; }
.field select { padding: 6px 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface-2); max-width: 100%; }
.tabs { display: flex; gap: 4px; flex-wrap: wrap; margin-left: auto; }
.tab { border: 1px solid transparent; background: none; padding: 7px 14px; border-radius: 8px; font-weight: 500; color: var(--muted); }
.tab[aria-selected="true"] { background: var(--accent-soft); color: var(--ink); border-color: var(--accent); }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; min-width: 0; }
.panel > header { padding: 12px 16px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.panel > header h2 { font-size: 16px; }
.panel .body { padding: 12px 16px 16px; }
.grid2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
.layout { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 16px; align-items: start; }
.scroll { overflow-x: auto; }
.tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
.tbl th, .tbl td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--line); vertical-align: middle; white-space: nowrap; }
.tbl th { font-size: 11.5px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
.tbl td.num, .tbl th.num { text-align: right; font-variant-numeric: tabular-nums; }
.tbl tr.me td { background: var(--accent-soft); }
.tbl tr.cut td { border-bottom: 2px dashed var(--accent); }
.tbl tr.cut2 td { border-bottom: 2px solid var(--accent); }
.chip { font-size: 11px; font-weight: 600; padding: 1px 7px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); display: inline-block; }
.chip.good { background: var(--good-soft); color: var(--good); border-color: transparent; }
.chip.warn { background: var(--warn-soft); color: var(--warn); border-color: transparent; }
.chip.bad { background: var(--bad-soft); color: var(--bad); border-color: transparent; }
.chip.acc { background: var(--accent-soft); color: var(--ink); border-color: var(--accent); }
.chip.gold { background: var(--gold-soft); color: var(--gold); border-color: transparent; }
.form { display: inline-flex; gap: 3px; }
.form i { font-style: normal; width: 18px; height: 18px; border-radius: 4px; font-size: 10.5px; font-weight: 700; display: inline-grid; place-items: center; }
.form i.W { background: var(--good-soft); color: var(--good); }
.form i.L { background: var(--bad-soft); color: var(--bad); }
.note { color: var(--muted); font-size: 12px; margin: 8px 0 0; }
.legend { display: flex; flex-wrap: wrap; gap: 8px 14px; margin-top: 10px; font-size: 12px; color: var(--muted); }
.mrow { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); gap: 8px; align-items: center; padding: 7px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface-2); }
.mrow.me { border-color: var(--accent); background: var(--accent-soft); }
.mrow .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mrow .t.r { text-align: right; }
.mrow .s { font-variant-numeric: tabular-nums; font-weight: 600; text-align: center; white-space: nowrap; }
.mrow .w { font-weight: 700; }
.list { display: grid; gap: 6px; margin: 0; padding: 0; list-style: none; }
.bracket { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; align-items: start; }
.round { display: grid; gap: 10px; align-content: start; }
.round > h3 { font-size: 14px; }
.card { border: 1px solid var(--line); border-radius: 8px; background: var(--surface-2); padding: 8px 10px; display: grid; gap: 4px; }
.card.me { border-color: var(--accent); }
.team { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 8px; align-items: center; }
.team .seed { font-size: 11px; color: var(--muted); width: 16px; text-align: right; }
.team .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.team .sc { font-variant-numeric: tabular-nums; font-weight: 600; text-align: right; white-space: nowrap; }
.team.win .nm, .team.win .sc { font-weight: 700; }
.team.lose { color: var(--muted); }
.champ { padding: 14px 16px; border-radius: 10px; background: var(--gold-soft); border: 1px solid var(--gold); }
.champ b { font-family: var(--font-display); font-size: 20px; display: block; }
@media (max-width: 900px) { .layout { grid-template-columns: minmax(0, 1fr); } .bracket, .grid3 { grid-template-columns: minmax(0, 1fr); } }
@media (max-width: 620px) { .grid2 { grid-template-columns: minmax(0, 1fr); } .top h1 { font-size: 24px; } .tabs { margin-left: 0; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>

<div class="wrap">
  <div class="top">
    <div>
      <div class="eyebrow" id="eyebrow"></div>
      <h1>Standings and playoffs</h1>
    </div>
    <span class="badge">Prototype: one invented season, built with the real schedule rules</span>
  </div>
  <section class="bar" aria-label="View options">
    <label class="field" for="weekSel">Results through
      <select id="weekSel"></select>
    </label>
    <label class="field" for="teamSel" id="teamField">Team schedule
      <select id="teamSel"></select>
    </label>
    <div class="tabs" role="tablist" aria-label="Screens">
      <button class="tab" role="tab" type="button" data-tab="standings" aria-selected="true">Standings</button>
      <button class="tab" role="tab" type="button" data-tab="schedule" aria-selected="false">Schedule</button>
      <button class="tab" role="tab" type="button" data-tab="cup" aria-selected="false">Mid-season Cup</button>
      <button class="tab" role="tab" type="button" data-tab="playoffs" aria-selected="false">Playoffs</button>
    </div>
  </section>
  <div id="view"></div>
</div>

<script>
(function () {
  "use strict";
  var D = /*SEASON_DATA*/null;
  var ME = D.me, state = { week: 30, tab: "standings", team: ME };
  var $ = function (id) { return document.getElementById(id); };
  var name = function (t) { return D.teams[t].name; };
  var f1 = function (n) { return (Math.round(n * 10) / 10).toFixed(1); };
  var cal = {}; D.calendar.forEach(function (c) { cal[c.week] = c; });
  var MON = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
  function dstr(iso) { var p = iso.split("-"); return MON[+p[1] - 1] + " " + +p[2]; }
  function esc(x) { return String(x).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }

  function seedsNow(w) {
    if (w >= 44) return D.playoffs.seeds;
    var rows = D.standings[w], top = rows.slice(0, 4).map(function (r) { return r.id; });
    var rest = rows.slice(4).sort(function (a, b) { return b.cumulative - a.cumulative || b.wins - a.wins; }).slice(0, 2).map(function (r) { return r.id; });
    return top.concat(rest);
  }
  function mrow(m, w, fromTeam) {
    var played = w <= state.week, a = m.a, b = m.b, wa = played && m.sa >= m.sb, wb = played && m.sb > m.sa;
    var me = a === ME || b === ME;
    return '<div class="mrow' + (me ? " me" : "") + '"><span class="t' + (wa ? " w" : "") + '">' + esc(name(a)) + '</span><span class="s">' + (played ? f1(m.sa) + " – " + f1(m.sb) : "vs") + '</span><span class="t r' + (wb ? " w" : "") + '">' + esc(name(b)) + "</span></div>";
  }

  function viewStandings() {
    var w = state.week, rows = D.standings[w], seeds = seedsNow(w), final = w >= 44;
    var tr = rows.map(function (r, i) {
      var seed = seeds.indexOf(r.id) + 1, tagc = "";
      if (seed === 1 || seed === 2) tagc = '<span class="chip gold">Seed ' + seed + ' · bye</span>';
      else if (seed >= 3 && seed <= 4) tagc = '<span class="chip acc">Seed ' + seed + "</span>";
      else if (seed >= 5) tagc = '<span class="chip acc">Seed ' + seed + " · wildcard</span>";
      var cls = (r.id === ME ? "me " : "") + (i === 3 ? "cut2" : "");
      return '<tr class="' + cls + '"><td class="num">' + (i + 1) + "</td><td>" + esc(name(r.id)) + (r.bonus ? ' <span class="chip good" title="Mid-season Cup champion">+1 Cup win</span>' : "") + '</td><td class="num">' + r.wins + "–" + r.losses + '</td><td class="num">' + f1(r.cumulative) + '</td><td><span class="form">' + r.form.map(function (x) { return "<i class=\"" + x + "\">" + x + "</i>"; }).join("") + "</span></td><td>" + tagc + "</td></tr>";
    }).join("");
    var played = Math.min(w, 44);
    var cupNote = w >= 24 ? "The Cup champion's bonus win is included." : "The Cup champion will receive one bonus win after week 24.";
    var right = '<section class="panel"><header><h2>How the playoffs are set</h2></header><div class="body"><p class="note" style="margin-top:0">Six teams qualify. The top 4 by record take seeds 1 to 4. The next 2 by cumulative points take seeds 5 and 6. Seeds 1 and 2 skip the wildcard round.</p><p class="note">Ranking: wins, then cumulative points. ' + cupNote + '</p><p class="note">' + (final ? "The regular season is over, so these seeds are final." : "Until week 44 these seeds are a projection.") + "</p></div></section>";
    var mw = D.matches[Math.max(1, Math.min(w, 49))] || [];
    var shown = w >= 1 ? mw.filter(function (m) { return gate(m, w); }) : [];
    var rs = '<section class="panel"><header><h2>Week ' + Math.max(1, Math.min(w, 49)) + " results</h2><span class=\"eyebrow\">" + esc(cal[Math.max(1, Math.min(w, 51))].phase) + '</span></header><div class="body"><ul class="list">' + (shown.length ? shown.map(function (m) { return "<li>" + mrow(m, Math.max(1, w), null) + "</li>"; }).join("") : '<li class="note">No results yet.</li>') + "</ul></div></section>";
    return '<div class="layout"><div style="display:grid;gap:16px"><section class="panel"><header><h2>Regular season</h2><span class="eyebrow">' + played + " of 44 weeks played</span></header><div class=\"body\"><div class=\"scroll\"><table class=\"tbl\"><thead><tr><th class=\"num\">#</th><th>Team</th><th class=\"num\">W–L</th><th class=\"num\">Points</th><th>Last 5</th><th>Playoff seed</th></tr></thead><tbody>" + tr + '</tbody></table></div><div class="legend"><span>Solid line: top 4 by record.</span><span>Seeds 5 and 6 go to the best cumulative points among the rest.</span></div></div></section>' + rs + '</div><div style="display:grid;gap:16px">' + right + "</div></div>";
  }
  // which matchups are knowable/visible as of week w
  function gate(m, w) {
    var k = m.kind;
    if (k === "regular") return true;
    if (k === "cup-group") return w >= 19;
    if (k === "cup-semi") return w >= 22;
    if (k === "cup-final") return w >= 23;
    if (k === "wildcard") return w >= 44;
    if (k === "playoff-semi") return w >= 45;
    if (k === "playoff-final") return w >= 47;
    return true;
  }
  function weekOf(m) { for (var w = 1; w <= 51; w++) if ((D.matches[w] || []).indexOf(m) >= 0) return w; return 0; }
  var KIND = { "regular": "Regular season", "cup-group": "Cup group", "cup-semi": "Cup semifinal", "cup-final": "Cup final", "wildcard": "Wildcard", "playoff-semi": "Playoff semifinal", "playoff-final": "Championship" };

  function viewSchedule() {
    var t = state.team, w = state.week, rows = [];
    for (var wk = 1; wk <= 49; wk++) {
      (D.matches[wk] || []).forEach(function (m) {
        if ((m.a !== t && m.b !== t) || !gate(m, w)) return;
        var opp = m.a === t ? m.b : m.a, mine = m.a === t ? m.sa : m.sb, theirs = m.a === t ? m.sb : m.sa, played = wk <= w;
        var res = played ? (mine >= theirs ? '<span class="chip good">W</span>' : '<span class="chip bad">L</span>') : '<span class="chip">Upcoming</span>';
        rows.push('<tr class="' + (m.kind !== "regular" ? "" : "") + '"><td class="num">' + wk + "</td><td>" + dstr(cal[wk].starts) + "</td><td>" + (m.kind === "regular" ? "" : '<span class="chip acc">' + KIND[m.kind] + "</span> ") + esc(name(opp)) + "</td><td>" + res + '</td><td class="num">' + (played ? f1(mine) + " – " + f1(theirs) : "") + "</td></tr>");
      });
    }
    var st = D.standings[w].filter(function (r) { return r.id === t; })[0], rank = D.standings[w].map(function (r) { return r.id; }).indexOf(t) + 1;
    return '<div class="layout"><section class="panel"><header><h2>' + esc(name(t)) + '</h2><span class="eyebrow">Weeks 1 to 49</span></header><div class="body"><div class="scroll"><table class="tbl"><thead><tr><th class="num">Wk</th><th>Starts</th><th>Opponent</th><th>Result</th><th class="num">Score</th></tr></thead><tbody>' + rows.join("") + '</tbody></table></div><p class="note">Every team plays every other team four times in 44 weeks. Cup and playoff games show up once the matchups are known. The Cup uses your normal weekly score, and your regular matchup still happens that week.</p></div></section><section class="panel"><header><h2>Record</h2></header><div class="body"><div class="eyebrow">Rank ' + rank + " of 12</div><div style=\"font-family:var(--font-display);font-size:28px;font-weight:700\">" + st.wins + "–" + st.losses + '</div><p class="note">' + f1(st.cumulative) + " cumulative points</p></div></section></div>";
  }

  function viewCup() {
    var w = state.week, C = D.cup;
    if (w < 19) return '<section class="panel"><div class="body"><b>The groups are drawn after week 19.</b><p class="note">Teams are split into 4 tiers of 3 by standings. Each of the 3 groups of 4 gets one team from every tier. Group play is weeks 20 to 22, semifinals week 23, final week 24.</p></div></section>';
    var groups = C.groups.map(function (g, gi) {
      var played = {};
      g.forEach(function (t) { played[t] = { w: 0, l: 0, p: 0 }; });
      var ms = [];
      for (var wk = 20; wk <= 22; wk++) (D.matches[wk] || []).forEach(function (m) {
        if (m.kind !== "cup-group" || g.indexOf(m.a) < 0) return;
        ms.push([wk, m]);
        if (wk <= w) { var wn = m.sa >= m.sb ? m.a : m.b, ls = wn === m.a ? m.b : m.a; played[wn].w++; played[ls].l++; played[m.a].p += m.sa; played[m.b].p += m.sb; }
      });
      var order = g.slice().sort(function (a, b) { return played[b].w - played[a].w || played[b].p - played[a].p; });
      return '<section class="panel"><header><h2>Group ' + "ABC"[gi] + "</h2></header><div class=\"body\"><div class=\"scroll\"><table class=\"tbl\"><thead><tr><th>Team</th><th class=\"num\">W–L</th><th class=\"num\">Points</th></tr></thead><tbody>" + order.map(function (t) { return '<tr class="' + (t === ME ? "me" : "") + '"><td>' + esc(name(t)) + '</td><td class="num">' + played[t].w + "–" + played[t].l + '</td><td class="num">' + f1(played[t].p) + "</td></tr>"; }).join("") + '</tbody></table></div><ul class="list" style="margin-top:10px">' + ms.map(function (x) { return "<li>" + '<div class="eyebrow" style="margin:4px 0 2px">Week ' + x[0] + "</div>" + mrow(x[1], x[0]) + "</li>"; }).join("") + "</ul></div></section>";
    }).join("");
    var ko = "";
    if (w >= 22) {
      var semis = [], final = null;
      (D.matches[23] || []).forEach(function (m) { if (m.kind === "cup-semi") semis.push(m); });
      (D.matches[24] || []).forEach(function (m) { if (m.kind === "cup-final") final = m; });
      var seedOf = function (t) { return C.seeds.indexOf(t) + 1; };
      var card = function (m, wk) {
        var played = wk <= w, wa = played && m.sa >= m.sb, wb = played && m.sb > m.sa;
        return '<div class="card' + (m.a === ME || m.b === ME ? " me" : "") + '"><div class="team' + (wa ? " win" : wb ? " lose" : "") + '"><span class="seed">' + (seedOf(m.a) || "") + '</span><span class="nm">' + esc(name(m.a)) + '</span><span class="sc">' + (played ? f1(m.sa) : "") + '</span></div><div class="team' + (wb ? " win" : wa ? " lose" : "") + '"><span class="seed">' + (seedOf(m.b) || "") + '</span><span class="nm">' + esc(name(m.b)) + '</span><span class="sc">' + (played ? f1(m.sb) : "") + "</span></div></div>";
      };
      ko = '<section class="panel"><header><h2>Knockout</h2><span class="eyebrow">Three group winners plus the best runner-up</span></header><div class="body"><div class="grid2"><div class="round"><h3>Semifinals, week 23</h3>' + semis.map(function (m) { return card(m, 23); }).join("") + '</div><div class="round"><h3>Final, week 24</h3>' + (w >= 23 && final ? card(final, 24) : '<div class="note" style="margin:0">Set after the semifinals.</div>') + "</div></div>" + (w >= 24 ? '<div class="champ" style="margin-top:12px"><span class="eyebrow">Cup champion</span><b>' + esc(name(C.champion)) + '</b><span class="note" style="display:block;margin:2px 0 0">Earns one bonus win in the regular-season standings. Runner-up: ' + esc(name(C.runner_up)) + ", who gets the injury mulligan.</span></div>" : "") + "</div></section>";
    }
    return '<div style="display:grid;gap:16px"><div class="grid3">' + groups + "</div>" + ko + "</div>";
  }

  function viewPlayoffs() {
    var w = state.week, P = D.playoffs, seeds = seedsNow(w), proj = w < 44;
    var seedOf = function (t) { return seeds.indexOf(t) + 1 || ""; };
    function teamRow(t, score, win, lose) { return '<div class="team' + (win ? " win" : lose ? " lose" : "") + '"><span class="seed">' + seedOf(t) + '</span><span class="nm">' + esc(name(t)) + '</span><span class="sc">' + score + "</span></div>"; }
    function single(a, b, wk) {
      var m = (D.matches[wk] || []).filter(function (x) { return x.a === a && x.b === b; })[0], played = m && wk <= w;
      return '<div class="card' + (a === ME || b === ME ? " me" : "") + '">' + teamRow(a, played ? f1(m.sa) : "", played && m.sa >= m.sb, played && m.sb > m.sa) + teamRow(b, played ? f1(m.sb) : "", played && m.sb > m.sa, played && m.sa >= m.sb) + "</div>";
    }
    function agg(a, b, weeks) {
      var sa = 0, sb = 0, legs = 0, la = [], lb = [];
      weeks.forEach(function (wk) { var m = (D.matches[wk] || []).filter(function (x) { return x.a === a && x.b === b; })[0]; if (m && wk <= w) { sa += m.sa; sb += m.sb; legs++; la.push(f1(m.sa)); lb.push(f1(m.sb)); } });
      var done = legs === weeks.length, win = done ? (sa > sb || (sa === sb && seeds.indexOf(a) < seeds.indexOf(b)) ? a : b) : null;
      return '<div class="card' + (a === ME || b === ME ? " me" : "") + '">' + teamRow(a, legs ? f1(sa) : "", win === a, win === b) + teamRow(b, legs ? f1(sb) : "", win === b, win === a) + '<div class="note" style="margin:0">' + (legs ? "Legs: " + la.join(" + ") + " vs " + lb.join(" + ") : "Two weeks, scores add up") + "</div></div>";
    }
    var wc = P.wildcard.map(function (p) { return w >= 44 ? single(p[0], p[1], 45) : '<div class="card"><div class="team"><span class="seed">' + seedOf(seeds[p === P.wildcard[0] ? 2 : 3]) + '</span><span class="nm">' + esc(name(seeds[p === P.wildcard[0] ? 2 : 3])) + '</span><span class="sc"></span></div><div class="team"><span class="seed">' + seedOf(seeds[p === P.wildcard[0] ? 5 : 4]) + '</span><span class="nm">' + esc(name(seeds[p === P.wildcard[0] ? 5 : 4])) + '</span><span class="sc"></span></div></div>'; }).join("");
    var byes = '<div class="card"><div class="team"><span class="seed">1</span><span class="nm">' + esc(name(seeds[0])) + '</span><span class="sc"><span class="chip gold">Bye</span></span></div><div class="team"><span class="seed">2</span><span class="nm">' + esc(name(seeds[1])) + '</span><span class="sc"><span class="chip gold">Bye</span></span></div></div>';
    var sf = w >= 45 ? P.semis.map(function (p) { return agg(p[0], p[1], [46, 47]); }).join("") : '<div class="note" style="margin:0">Set after the wildcard round. Seed 1 plays the lowest remaining seed.</div>';
    var fin = w >= 47 ? agg(P.final[0], P.final[1], [48, 49]) : '<div class="note" style="margin:0">Set after the semifinals.</div>';
    var champ = w >= 49 ? '<div class="champ"><span class="eyebrow">League champion</span><b>' + esc(name(P.champion)) + "</b></div>" : "";
    return '<div style="display:grid;gap:16px">' + champ + '<section class="panel"><header><h2>Playoff bracket</h2><span class="eyebrow">' + (proj ? "Projected seeds: not final until week 44" : "Final seeds") + '</span></header><div class="body"><div class="bracket"><div class="round"><h3>Wildcard, week 45</h3>' + byes + wc + '</div><div class="round"><h3>Semifinals, weeks 46 and 47</h3>' + sf + '</div><div class="round"><h3>Championship, weeks 48 and 49</h3>' + fin + '</div></div><p class="note">Multi-week rounds add the weekly totals. A tie goes to the higher seed. Weeks 50 and 51 are spare for corrections or delays.</p></div></section></div>';
  }

  function render() {
    var w = state.week, c = cal[Math.max(1, Math.min(w || 1, 51))];
    $("eyebrow").textContent = (w === 0 ? "Before the season" : "Week " + w + " · " + c.phase);
    document.querySelectorAll(".tab").forEach(function (b) { b.setAttribute("aria-selected", String(b.dataset.tab === state.tab)); });
    $("teamField").hidden = state.tab !== "schedule";
    $("view").innerHTML = state.tab === "standings" ? viewStandings() : state.tab === "schedule" ? viewSchedule() : state.tab === "cup" ? viewCup() : viewPlayoffs();
  }
  $("weekSel").innerHTML = '<option value="0">Before week 1</option>' + D.calendar.map(function (c) { return '<option value="' + c.week + '">Week ' + c.week + " (" + c.phase + ")</option>"; }).join("");
  $("weekSel").value = "30";
  $("teamSel").innerHTML = D.teams.map(function (t) { return '<option value="' + t.id + '">' + esc(t.name) + "</option>"; }).join("");
  $("teamSel").value = String(ME);
  $("weekSel").addEventListener("change", function (e) { state.week = +e.target.value; render(); });
  $("teamSel").addEventListener("change", function (e) { state.team = +e.target.value; render(); });
  document.querySelector(".tabs").addEventListener("click", function (e) { var b = e.target.closest("[data-tab]"); if (b) { state.tab = b.dataset.tab; render(); } });
  window.__st = { D: D, state: state, render: render };
  render();
})();
