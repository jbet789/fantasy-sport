<style>

}
:root[data-theme="dark"] {
  --bg: #0e1920; --surface: #15232d; --surface-2: #1a2b37; --ink: #e5ecf1; --muted: #97a9b7; --line: #2a3d4a;
  --accent: #5ccdd6; --accent-ink: #052529; --accent-soft: #143439; --bad: #ff8a80; --bad-soft: #3b1f1d; --good: #7bd89c; --good-soft: #183425; --warn: #f2b45e; --warn-soft: #3a2c14;
  --nfl: #d18b6b; --nba: #f1975a; --mlb: #7ea8ee; --nhl: #6cc3da; --mls: #7fcb82; --f1: #ee7ca4;

}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 14px; line-height: 1.45;
  padding-inline: max(16px, env(safe-area-inset-left, 0px)) max(16px, env(safe-area-inset-right, 0px)); padding-block: 20px 40px; }
h1, h2, h3 { font-family: var(--font-display); margin: 0; text-wrap: balance; }
button, select, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.wrap { max-width: 1100px; margin: 0 auto; display: grid; gap: 16px; }
.eyebrow { font-size: 11.5px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.top { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 8px 24px; }
.top h1 { font-size: 28px; letter-spacing: -0.01em; }
.badge { display: inline-block; padding: 2px 8px; border: 1px solid var(--line); border-radius: 999px; font-size: 11.5px; color: var(--muted); background: var(--surface); }
.bar { display: flex; flex-wrap: wrap; gap: 12px 16px; align-items: end; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 16px; }
.field { display: grid; gap: 2px; font-size: 12px; color: var(--muted); min-width: 0; }
.field select, .field input[type=search], .field input[type=text] { padding: 6px 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface-2); max-width: 100%; min-width: 0; }

.tab { border: 1px solid transparent; background: none; padding: 7px 14px; border-radius: 8px; font-weight: 500; color: var(--muted); }
.tab[aria-selected="true"] { background: var(--accent-soft); color: var(--ink); border-color: var(--accent); }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; min-width: 0; }
.panel > header { padding: 12px 16px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.panel > header h2 { font-size: 16px; }
.panel .body { padding: 12px 16px 16px; }
.layout { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 16px; align-items: start; }
.side { display: grid; gap: 16px; }
.two { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; }
ol.list, ul.list { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.row { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 8px; padding: 7px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface-2); }
.row.sel { border-color: var(--accent); background: var(--accent-soft); }
.row .who { min-width: 0; display: grid; gap: 1px; }
.row .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500; }
.row .meta { color: var(--muted); font-size: 12px; display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: center; }
.row .acts { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }

label.row.off { opacity: 0.55; cursor: not-allowed; }
.tag { display: inline-block; min-width: 36px; text-align: center; padding: 1px 6px; border-radius: 4px; font-size: 11px; font-weight: 700; color: var(--c); border: 1px solid var(--c); background: color-mix(in srgb, var(--c) 12%, var(--surface)); }
.s-NFL { --c: var(--nfl); } .s-NBA { --c: var(--nba); } .s-MLB { --c: var(--mlb); }
.s-NHL { --c: var(--nhl); } .s-MLS { --c: var(--mls); } .s-F1 { --c: var(--f1); }
.chip { font-size: 11px; font-weight: 600; padding: 1px 7px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); }
.chip.good { background: var(--good-soft); color: var(--good); border-color: transparent; }
.chip.warn { background: var(--warn-soft); color: var(--warn); border-color: transparent; }

.btn:hover:not(:disabled) { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }

.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.note { color: var(--muted); font-size: 12px; margin: 8px 0 0; }

.tbl th, .tbl td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
.tbl th { font-size: 11.5px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }

.trade .leg b { display: block; font-size: 12px; color: var(--muted); font-weight: 600; margin-bottom: 2px; }
.trade .p { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
@media (max-width: 900px) { .layout { grid-template-columns: minmax(0, 1fr); } }
@media (max-width: 620px) { .two, .trade .legs { grid-template-columns: minmax(0, 1fr); } .top h1 { font-size: 24px; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

<script>
(function () {
  "use strict";
  var SPORTS = ["NFL", "NBA", "MLB", "NHL", "MLS", "F1"];
  var POS = { NFL: ["QB", "RB", "WR", "TE"], NBA: ["Guard", "Wing", "Big"], MLB: ["SP", "RP", "Hitter"], NHL: ["Skater", "Goalie"], MLS: ["Forward", "Midfielder", "Defender", "Goalkeeper"], F1: ["Driver"] };
  var FIRST = "Aaron Abel Adrian Alec Amir Andre Anton Arlo Beau Bennett Caleb Callum Cass Dario Dante Dmitri Eli Emeka Felix Finn Gabe Hakim Hugo Idris Ivan Jalen Jonas Kai Kellan Kofi Lars Leo Luca Malik Marco Mateo Nico Noor Omar Orin Pablo Quinn Rafa Reid Rory Sami Soren Tariq Teo Tobias Uri Viktor Wes Xavier Yusuf Zane Zeke".split(" ");
  var LAST = "Abara Alder Ashby Bexley Brandt Calloway Cardona Castellan Dunmore Ellery Farrow Fenwick Garrity Halloran Hargrove Ibarra Jessup Kessler Lindqvist Marlowe Nwosu Okafor Pellegrin Quillan Rasmus Salazar Thorne Ulloa Varga Whitlock Yeager Zeller Aldous Branko Corvin Dacosta Esposito Falk Gallo Hendry Iverson Jarrah Koval Lowry Maddox Navarro Oyelaran Prescott Quade Renfro Stroud Tamsin Underhill Vance Wexler".split(" ");
  var ME = 4, TEAMS = 12, ACTIVE_LIMIT = 20, IR_LIMIT = 4, F1_CAP = 2;
  var H = 3600e3, DAY = 24 * H, MIN = 60e3;
  var WAIVER_DROPPED = DAY, WAIVER_NEW = 2 * DAY, READD_BLOCK = 7 * DAY, VETO_WINDOW = 24 * H;
  var U = function (y, m, d, h, mi) { return Date.UTC(y, m - 1, d, h || 0, mi || 0); };
  var DEADLINE = U(2027, 11, 9, 12, 0);               // end of week 44: Tuesday noon
  var BASE = U(2027, 3, 27, 14, 0);                   // Saturday of week 12
  var PRESETS = { sat: BASE, mon: U(2027, 3, 29, 20, 0), tue: U(2027, 3, 30, 8, 59), tue1000: U(2027, 3, 30, 10, 0), tuelock: U(2027, 3, 30, 12, 1), late: U(2027, 11, 9, 12, 1) };

  function rng(seed) { return function () { seed |= 0; seed = seed + 0x6D2B79F5 | 0; var t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  var DAYS = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"], MONS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
  function fmt(ms) {
    var d = new Date(ms), h = d.getUTCHours(), m = d.getUTCMinutes(), ap = h >= 12 ? "p.m." : "a.m.";
    return DAYS[d.getUTCDay()] + " " + MONS[d.getUTCMonth()] + " " + d.getUTCDate() + ", " + ((h + 11) % 12 + 1) + ":" + (m < 10 ? "0" : "") + m + " " + ap;
  }
  function nextNine(ms) { var d = new Date(ms); var n = Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate(), 9, 0); return n > ms ? n : n + DAY; }
  function isSlot(ms) { var d = new Date(ms); return d.getUTCDay() === 2 && d.getUTCHours() === 9 && d.getUTCMinutes() === 0; }
  function nextRun(ms) { var t = nextNine(ms - 1 + 1); while (!isSlot(t)) t += DAY; return t; }   // first Tuesday 9:00 strictly after ms

  // ---------- state ----------
  var S;
  var ui = { tab: "fa", sport: "all", q: "", onlyNow: false, compose: null, msg: "", err: false, results: null, tradeDraft: null };
  var $ = function (id) { return document.getElementById(id); };
  function say(t, err) { ui.msg = t || ""; ui.err = !!err; var m = $("msg"); m.textContent = ui.msg; m.className = "msg" + (err ? " err" : ""); }

  function build(now) {
    var s = { now: now, players: {}, owner: {}, active: [], ir: [], waivers: {}, blocked: {}, claims: [], trades: [], log: [], nextId: 1, tradeId: 1, locked: false };
    var r = rng(4242), used = {};
    function mk(sport, extra) {
      var name; do { name = FIRST[Math.floor(r() * FIRST.length)] + " " + LAST[Math.floor(r() * LAST.length)]; } while (used[name]); used[name] = 1;
      var p = { id: s.nextId++, name: name, sport: sport, pos: POS[sport][Math.floor(r() * POS[sport].length)], last: Math.round((r() * 34 - 6) * 10) / 10 };
      s.players[p.id] = p; return p;
    }
    var mix = ["NFL", "NBA", "MLB", "NHL", "MLS", "NFL", "NBA", "MLB", "NHL", "MLB", "NBA", "NFL", "NHL", "MLB", "NBA", "NFL", "MLS", "NHL", "MLB", "NBA"];
    for (var t = 0; t < TEAMS; t++) {
      var a = [], f1 = 0;
      var n = t === ME ? 19 : 20;
      for (var i = 0; i < n; i++) {
        var sp = mix[(i + t * 3) % mix.length];
        if (t === ME && i >= 17) sp = "F1";                      // my two F1 drivers: the cap will matter
        else if (t !== ME && i === 15 && t % 3 === 0) sp = "F1";
        var p = mk(sp); a.push(p.id); s.owner[p.id] = t;
      }
      s.active.push(a); s.ir.push([]);
      for (var k = 0; k < 2; k++) { var q = mk(mix[(k + t) % mix.length]); q.inj = "Out"; s.ir[t].push(q.id); s.owner[q.id] = t; }
    }
    // free-agent pool
    var pool = [];
    for (var j = 0; j < 62; j++) pool.push(mk(j < 5 ? "F1" : SPORTS[j % 5]));
    pool.forEach(function (p) { s.owner[p.id] = null; });
    // five call-ups and five recent drops sit on waivers
    var base = BASE;
    pool.slice(5, 10).forEach(function (p) { s.waivers[p.id] = nextNine(U(2027, 3, 27, 10, 0) + WAIVER_NEW); });                 // new arrivals: Tuesday run
    pool.slice(10, 13).forEach(function (p) { s.waivers[p.id] = nextNine(U(2027, 3, 26, 10, 0) + WAIVER_DROPPED); });              // dropped Friday: free agent Sunday 9:00
    pool.slice(13, 15).forEach(function (p) { s.waivers[p.id] = nextNine(U(2027, 3, 26, 20, 0) + WAIVER_NEW); });                 // arrivals: Monday 9:00? (min ends Sun 8 p.m.)
    // two players I dropped on Wednesday: free agents now, but blocked for me for 7 days
    pool.slice(15, 17).forEach(function (p) { s.blocked[ME + ":" + p.id] = U(2027, 3, 24, 10, 0) + READD_BLOCK; });
    s.log.push({ when: U(2027, 3, 24, 10, 0), text: "Team 5 (you) dropped " + s.players[pool[15].id].name + " and " + s.players[pool[16].id].name + "." });
    s.priority = [7, 2, 9, ME, 0, 11, 5, 1, 10, 3, 8, 6];        // worst record first, resets every week
    s.otherPlayers = pool.map(function (p) { return p.id; });
    // seeded trades: one offered to me, one already in its 24-hour review
    var t2 = 1, mine = s.active[ME];
    s.trades.push(mkTrade(s, 1, t2, ME, [s.active[t2][12]], [mine[11]], U(2027, 3, 26, 18, 0)));
    var tr = mkTrade(s, 6, 9, 9 === 6 ? 0 : 6, [s.active[6][14]], [s.active[9][13]], U(2027, 3, 26, 9, 0));
    tr.proposer = 6; tr.partner = 9; tr.status = "pending_veto"; tr.accepted_at = U(2027, 3, 27, 9, 0); tr.veto_until = tr.accepted_at + VETO_WINDOW;
    s.trades.push(tr);
    return s;
  }
  function mkTrade(s, id, proposer, partner, give, get, at) {
    return { id: s.tradeId++, proposer: proposer, partner: partner, give: give, get: get, drops: {}, status: "proposed", at: at, note: "" };
  }
  function tn(t) { return t === ME ? "Team 5 (you)" : "Team " + (t + 1); }
  function pl(id) { return S.players[id]; }
  function tag(s) { return '<span class="tag s-' + s + '">' + s + "</span>"; }
  function inj(p) { return p.inj ? '<span class="chip bad">' + p.inj + "</span>" : ""; }
  function esc(x) { return String(x).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }

  function starters(t) { return S.active[t].slice(0, 10); }
  function lineupLocked() { var d = new Date(S.now), h = d.getUTCHours(); return !(d.getUTCDay() === 2 && h >= 3 && h < 12); }   // open Tuesday 3:00 a.m. to noon
  function lockedSet(t) { return lineupLocked() ? starters(t) : []; }
  function isLocked(t, id) { return lockedSet(t).indexOf(id) >= 0; }
  function f1count(ids) { return ids.filter(function (id) { return pl(id).sport === "F1"; }).length; }
  function roster(t) { return S.active[t].concat(S.ir[t]); }
  function without(arr, x) { return arr.filter(function (y) { return y !== x; }); }

  // ---------- rules (mirrors engine/transactions.py) ----------
  function isFA(id, now) {
    if (S.owner[id] !== null && S.owner[id] !== undefined) return false;
    var rel = S.waivers[id];
    return rel === undefined || (rel <= now && !isSlot(rel));
  }
  function addProblem(team, id, drop, now) {
    var b = S.blocked[team + ":" + id];
    if (b && b > now) return tn(team) + " dropped " + pl(id).name + " within the last 7 days (blocked until " + fmt(b) + ")";
    var active = S.active[team].slice(), ir = S.ir[team].slice();
    if (drop != null) {
      if (active.indexOf(drop) < 0 && ir.indexOf(drop) < 0) return pl(drop).name + " is not on the roster";
      if (isLocked(team, drop)) return pl(drop).name + " is in the locked lineup and can't be dropped until the next lock";
      active = without(active, drop); ir = without(ir, drop);
    }
    if (active.length >= ACTIVE_LIMIT) return "Roster is full: name an active player to drop";
    if (pl(id).sport === "F1" && f1count(active.concat(ir)) >= F1_CAP) return "Adding " + pl(id).name + " would put the team over the F1 cap of " + F1_CAP + ": drop an F1 driver";
    return null;
  }
  function dropPlayer(team, id, at, how) {
    S.active[team] = without(S.active[team], id); S.ir[team] = without(S.ir[team], id);
    S.owner[id] = null; S.waivers[id] = nextNine(at + WAIVER_DROPPED); S.blocked[team + ":" + id] = at + READD_BLOCK;
    S.log.unshift({ when: at, text: tn(team) + " dropped " + pl(id).name + (how ? " (" + how + ")" : "") + ". On waivers until " + fmt(S.waivers[id]) + "." });
  }
  function addToBench(team, id, at, how) {
    S.active[team].push(id); S.owner[id] = team; delete S.waivers[id];
    S.log.unshift({ when: at, text: tn(team) + " added " + pl(id).name + " (" + how + ")." });
  }
  function runWaivers(runTime, claims) {
    var eligible = {};
    Object.keys(S.waivers).forEach(function (id) { var rel = S.waivers[id]; if (isSlot(rel) && rel <= runTime) eligible[id] = 1; });
    var queue = S.priority.slice(), pending = {}, taken = {}, results = [];
    Object.keys(claims).forEach(function (t) { pending[t] = claims[t].slice(); });
    function problem(team, c) {
      var p = c.player;
      if (taken[p] !== undefined) return ["lost", "Awarded to " + tn(taken[p]) + ", who had priority"];
      if (!eligible[p]) {
        if (S.owner[p] !== null && S.owner[p] !== undefined) return ["void", "Already on a roster"];
        if (S.waivers[p] && S.waivers[p] > runTime) return ["void", "Not claimable at this run: released " + fmt(S.waivers[p])];
        return ["void", "Already a free agent: add him directly"];
      }
      var m = addProblem(+team, p, c.drop, runTime);
      return m ? ["void", m] : null;
    }
    for (;;) {
      var progressed = false;
      for (var qi = 0; qi < queue.length; qi++) {
        var team = queue[qi], list = pending[team] || [], won = null;
        for (var ci = 0; ci < list.length; ci++) if (!problem(team, list[ci])) { won = list[ci]; break; }
        if (won) {
          if (won.drop != null) dropPlayer(team, won.drop, runTime, "to make room for a claim");
          addToBench(team, won.player, runTime, "waiver claim");
          taken[won.player] = team;

  $("comm").addEventListener("change", render);
  document.querySelector(".tabs").addEventListener("click", function (e) { var b = e.target.closest("[data-tab]"); if (b) { ui.tab = b.dataset.tab; say(""); render(); } });
  $("view").addEventListener("input", function (e) { if (e.target.id === "qIn") { ui.q = e.target.value; var pos = e.target.selectionStart; render(); var q = $("qIn"); q.focus(); q.setSelectionRange(pos, pos); } });
  $("view").addEventListener("change", function (e) {
    var t = e.target;
    if (t.id === "sportSel") { ui.sport = t.value; render(); }
    else if (t.id === "nowOnly") { ui.onlyNow = t.checked; render(); }
    else if (t.id === "partnerSel") { ui.tradeDraft.partner = +t.value; ui.tradeDraft.get = []; render(); }
    else if (t.dataset && t.dataset.act === "pick") {
      var arr = ui.tradeDraft[t.dataset.key], id = +t.dataset.id, i = arr.indexOf(id);
      if (t.checked && i < 0) arr.push(id); if (!t.checked && i >= 0) arr.splice(i, 1);
      if (t.dataset.key === "give") ui.tradeDraft.drops = ui.tradeDraft.drops.filter(function (x) { return arr.indexOf(x) < 0; });
      render();
    }
  });
  $("view").addEventListener("click", function (e) {
    var b = e.target.closest("[data-act]"); if (!b || b.disabled || b.type === "checkbox") return;
    var act = b.dataset.act, id = +b.dataset.id;
    if (act === "start") { ui.compose = { id: id, mode: b.dataset.mode }; say(""); render(); return; }
    if (act === "cancel") { ui.compose = null; say(""); render(); return; }
    if (act === "confirm") {
      var c = ui.compose, dv = $("dropSel").value, drop = dv === "" ? null : +dv;
      var pr = addProblem(ME, c.id, drop, S.now);
      if (pr) { say(pr, true); return; }
      if (c.mode === "add") { if (drop != null) dropPlayer(ME, drop, S.now, "to make room for an add"); addToBench(ME, c.id, S.now, "free agent"); say(pl(c.id).name + " added to your bench."); }
      else { S.claims.push({ player: c.id, drop: drop }); say("Claim placed for " + pl(c.id).name + ". It runs " + fmt(nextRun(S.now))); }
      ui.compose = null; render(); return;
    }
    if (act === "up" || act === "down") { var i = +b.dataset.i, j = act === "up" ? i - 1 : i + 1; var x = S.claims[i]; S.claims[i] = S.claims[j]; S.claims[j] = x; render(); return; }
    if (act === "remove") { S.claims.splice(+b.dataset.i, 1); render(); return; }
    if (act === "run") { var t = nextRun(S.now); var mine = S.claims.slice(); S.claims = []; ui.results = execRun(t, mine); settle(); say("Ran the " + fmt(t) + " processing"); render(); return; }
    var T = S.trades.filter(function (t) { return t.id === id; })[0];
    if (act === "propose") {
      var d = ui.tradeDraft, tr = { id: S.tradeId++, proposer: ME, partner: d.partner, give: d.give.slice(), get: d.get.slice(), drops: {}, status: "proposed", at: S.now, note: "" };
      tr.drops[ME] = d.drops.slice(); var pr2 = tradeProblem(tr, true, S.now); if (pr2) { say(pr2, true); return; }
      S.trades.push(tr); ui.tradeDraft = null; say("Proposal sent to " + tn(tr.partner) + "."); render(); return;
    }
    if (act === "accept" || act === "simaccept") {
      var pr3 = tradeProblem(T, true, S.now); if (pr3) { say(pr3, true); return; }
      T.status = "pending_veto"; T.accepted_at = S.now; T.veto_until = S.now + VETO_WINDOW; say("Accepted. The commissioner has 24 hours to veto, then it completes."); render(); return;
    }
    if (act === "decline") { T.status = "declined"; say("Offer declined."); render(); return; }
    if (act === "withdraw") { T.status = "withdrawn"; say("Proposal withdrawn."); render(); return; }
    if (act === "veto") {
      var rs = document.getElementById("vr" + id).value.trim();
      if (!rs) { say("A reason is required for a veto.", true); return; }
      if (S.now >= T.veto_until) { say("The 24-hour window has ended.", true); return; }
      T.status = "vetoed"; T.note = "Vetoed: " + rs; S.log.unshift({ when: S.now, text: "Commissioner vetoed trade " + T.id + ": " + rs }); say("Trade vetoed."); render(); return;
    }
  });
  window.__wt = { get S() { return S; }, ui: ui, ME: ME, advanceTo: advanceTo, nextRun: nextRun, fmt: fmt, reset: reset };
  reset("sat");
})();
</script>
